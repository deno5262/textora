name: Textora build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack uploaded zip (if present)
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          while IFS= read -r -d '' f; do
            [ -n "$f" ] || continue
            echo "Unpacking $f"
            unzip -oq "$f" -x ".github/*"
            found=1
          done < <(printf '%s\0' textora-github*.zip | sort -zV)
          if [ "$found" = 1 ]; then
            rm -f textora-github*.zip
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Update Textora project" || true
            git push
          fi

      - name: Check project exists
        run: test -f package.json || (echo "Upload textora-github.zip to the repo first" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install
      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUSH_READY: ${{ secrets.GOOGLE_SERVICES_JSON != '' && 'on' || 'off' }}
          VITE_NATIVE_BUBBLES: 'on'
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USER: ${{ secrets.VITE_TURN_USER }}
          VITE_TURN_PASS: ${{ secrets.VITE_TURN_PASS }}

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          node scripts/add-bubbles.mjs
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; fi
          npx cap sync android
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Use fixed signing key (so new APKs install over old ones)
        run: |
          mkdir -p ~/.android
          if [ -f keystore/debug.keystore ]; then cp keystore/debug.keystore ~/.android/debug.keystore; fi

      - name: Build APK (falls back to a build without bubbles if the native part fails)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUSH_READY: ${{ secrets.GOOGLE_SERVICES_JSON != '' && 'on' || 'off' }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USER: ${{ secrets.VITE_TURN_USER }}
          VITE_TURN_PASS: ${{ secrets.VITE_TURN_PASS }}
        run: |
          build_apk() { (cd android && chmod +x gradlew && ./gradlew assembleDebug); }
          if (cd android && chmod +x gradlew && ./gradlew assembleDebug > ../gradle1.log 2>&1); then exit 0; fi
          err=$(grep -m8 -E "error:|e: |What went wrong|Execution failed|AAPT|Manifest merger|cannot find symbol|does not exist" -A1 gradle1.log | tr '\n' ' ' | tr -d '"%' | cut -c1-700)
          echo "::warning title=Bubble build error::$err"
          tail -n 60 gradle1.log || true
          echo "::warning::Native bubble code failed to build. Building WITHOUT bubbles."
          rm -rf android
          VITE_NATIVE_BUBBLES=off npm run build
          npx cap add android
          node scripts/patch-android.mjs
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; fi
          npx cap sync android
          build_apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubble-build-log
          path: gradle1.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: textora-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
