name: Textora build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack uploaded zip (if present)
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          while IFS= read -r -d '' f; do
            [ -n "$f" ] || continue
            echo "Unpacking $f"
            unzip -oq "$f" -x ".github/*"
            found=1
          done < <(printf '%s\0' textora-github*.zip | sort -zV)
          if [ "$found" = 1 ]; then
            rm -f textora-github*.zip
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Update Textora project" || true
            git push
          fi

      - name: Check project exists
        run: test -f package.json || (echo "Upload textora-github.zip to the repo first" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install
      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUSH_READY: ${{ secrets.GOOGLE_SERVICES_JSON != '' && 'on' || 'off' }}
          VITE_NATIVE_BUBBLES: 'on'
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USER: ${{ secrets.VITE_TURN_USER }}
          VITE_TURN_PASS: ${{ secrets.VITE_TURN_PASS }}

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          node scripts/add-bubbles.mjs
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; fi
          npx cap sync android
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Use fixed signing key (so new APKs install over old ones)
        run: |
          mkdir -p ~/.android
          if [ -f keystore/debug.keystore ]; then cp keystore/debug.keystore ~/.android/debug.keystore; fi

      - name: Build APK (3 tries - full bubbles, then basic native alerts, then plain)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUSH_READY: ${{ secrets.GOOGLE_SERVICES_JSON != '' && 'on' || 'off' }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USER: ${{ secrets.VITE_TURN_USER }}
          VITE_TURN_PASS: ${{ secrets.VITE_TURN_PASS }}
        run: |
          fresh_android() {
            rm -rf android
            npx cap add android
            node scripts/patch-android.mjs
            if [ "$1" != "none" ]; then node scripts/add-bubbles.mjs "$1"; fi
            if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; fi
            npx cap sync android
          }
          report() {
            jerr=$(grep -E "\.java:[0-9]+: error:|error: |AAPT: error|Manifest merger failed" -A2 "$1" | grep -v '^Note:' | head -14 | tr '\n' ' ' | tr -d '"%' | cut -c1-700)
            err=$(awk '/What went wrong/{f=1} /^\* Try:/{exit} f{print}' "$1" | grep -v '^$' | head -6 | tr '\n' ' ' | tr -d '"%' | cut -c1-300)
            echo "::warning title=$2::${jerr:-$err}"
            { echo "### $2"; echo '```'; grep -E "\.java:[0-9]+: error:|error: |AAPT: error|Manifest merger failed" -A3 "$1" | grep -v '^Note:' | head -40; echo '--- gradle summary ---'; sed -n '/FAILURE:/,$p' "$1" | head -25; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          }
          if (cd android && chmod +x gradlew && ./gradlew assembleDebug > ../gradle1.log 2>&1); then echo "Built with chat bubbles"; exit 0; fi
          report gradle1.log "Bubble build error"
          echo "::warning::Bubble code failed. Trying basic native alerts (picture + delivery ticks + call ringing, no bubbles)."
          fresh_android basic
          if (cd android && chmod +x gradlew && ./gradlew assembleDebug > ../gradle2.log 2>&1); then echo "Built with basic native alerts"; exit 0; fi
          report gradle2.log "Basic native build error"
          echo "::warning::Native code failed. Building WITHOUT native alerts."
          VITE_NATIVE_BUBBLES=off npm run build
          fresh_android none
          (cd android && chmod +x gradlew && ./gradlew assembleDebug)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubble-build-log
          path: gradle*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: textora-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
