name: Textora build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack uploaded zip (if present)
        run: |
          if [ -f textora-github.zip ]; then
            unzip -oq textora-github.zip -x ".github/*"
            rm textora-github.zip
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Add Textora project" || true
            git push
          fi

      - name: Check project exists
        run: test -f package.json || (echo "Upload textora-github.zip to the repo first" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install
      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; fi
          npx cap sync android
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: textora-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
